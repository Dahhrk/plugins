name: Version bump

on:
  pull_request:

permissions:
  contents: read

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-version-bump.mjs
      - name: Drift vs the Devin factory pack
        run: |
          rm -rf /tmp/devin-factory-plugins
          git clone --depth 1 https://github.com/Dahhrk/devin-factory-plugins /tmp/devin-factory-plugins
          node scripts/drift-check.mjs /tmp/devin-factory-plugins
