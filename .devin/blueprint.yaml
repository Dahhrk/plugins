# Devin cloud environment for this product.
# Git-backed blueprint - Devin discovers it at the repo root and builds cloud
# session environments from it. No secrets belong here; this repo is PUBLIC.

maintenance: |
  git config user.name "Dark"
  git config user.email "young1504@outlook.com"
  npm install --no-save ajv ajv-formats

knowledge:
  - name: test
    contents: |
      Friend verify - run on every unit of work before push:
        node scripts/validate-plugins.mjs
      (ajv schema check on .cursor-plugin/marketplace.json + **/plugin.json;
       needs ajv + ajv-formats installed as above)

  - name: rules
    contents: |
      Draft PRs only - the author never merges; a Bugbot or fresh-verifier
      VERIFIED verdict certifies. Autopilot stays off. One verifiable unit
      per PR with Done means + Keep.
      PUBLIC repo - no secrets, no private Feature Map content.
